<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>드래곤 교배시간 역산기</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="교배시간">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #121212;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.app-container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 600px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 32px) 24px;
}

header {
    margin-bottom: 40px;
}

h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #ffffff;
    line-height: 1.3;
}

.title-sub {
    font-size: 15px;
    color: #a1a1aa;
    margin-top: 8px;
}

.input-section {
    flex: 1;
}

.label {
    display: block;
    margin-bottom: 12px;
    font-weight: 600;
    font-size: 15px;
    color: #a1a1aa;
}

.row {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
}

.input-group {
    position: relative;
    flex: 1;
}

.input-group span {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #71717a;
    font-size: 16px;
    font-weight: 600;
    pointer-events: none;
}

input, select {
    width: 100%;
    padding: 20px 48px 20px 20px;
    border: none;
    border-radius: 16px;
    background: #27272a;
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    outline: none;
    transition: background 0.2s;
    appearance: none;
    -webkit-appearance: none;
    user-select: auto;
    -webkit-user-select: auto;
}

select {
    padding-right: 20px;
    font-size: 18px;
    font-weight: 600;
}

input::placeholder {
    color: #52525b;
    font-weight: 500;
}

input:focus, select:focus {
    background: #3f3f46;
    box-shadow: 0 0 0 2px #3b82f6 inset;
}

.button-container {
    margin-top: 16px;
}

button {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 16px;
    background: #3b82f6;
    color: #ffffff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
}

button:active {
    transform: scale(0.96);
    background: #2563eb;
}

.result {
    background: #1e1e1e;
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    border: 1px solid #2d2d2d;
    margin-top: 32px;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.result-title {
    color: #a1a1aa;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 600;
}

.time {
    font-size: 38px;
    font-weight: 900;
    margin-bottom: 16px;
    color: #93c5fd;
    letter-spacing: -1px;
}

.info {
    color: #71717a;
    font-size: 14px;
    line-height: 1.6;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="app-container">
    <header>
        <h1>교배시간 역산기</h1>
        <div class="title-sub">원래 교배시간을 정확하게 계산해 드립니다.</div>
    </header>

    <div class="input-section">
        <label class="label">게임에 표시되는 시간</label>
        <div class="row">
            <div class="input-group">
                <input type="number" id="hour" placeholder="0" inputmode="numeric" pattern="[0-9]*">
                <span>시간</span>
            </div>
            <div class="input-group">
                <input type="number" id="minute" placeholder="0" inputmode="numeric" pattern="[0-9]*">
                <span>분</span>
            </div>
        </div>

        <label class="label">계정 등급 혜택</label>
        <select id="grade">
            <option value="0">노말 (0%)</option>
            <option value="0.05">브론즈 / 실버 (5%)</option>
            <option value="0.08">골드 / 플래티넘 (8%)</option>
            <option value="0.10">다이아 / MVP (10%)</option>
        </select>
        
        <div id="result"></div>
    </div>

    <div class="button-container">
        <button onclick="calculate()">원래 시간 계산하기</button>
    </div>
</div>

<script>
function calculate() {
    const hourInput = document.getElementById("hour").value;
    const minuteInput = document.getElementById("minute").value;
    
    const h = Number(hourInput);
    const m = Number(minuteInput);
    const rate = Number(document.getElementById("grade").value);

    if (hourInput === "" && minuteInput === "") return;

    const displayedMinutes = (h * 60) + m;
    const originalMinutes = Math.round(displayedMinutes / (1 - rate));

    const finalHour = Math.floor(originalMinutes / 60);
    const finalMinute = originalMinutes % 60;

    document.getElementById("result").innerHTML = `
        <div class="result">
            <div class="result-title">원래 교배시간</div>
            <div class="time">${finalHour}시간 ${finalMinute}분</div>
            <div class="info">
                적용 감소율: ${rate * 100}%<br>
                입력 시간: ${h}시간 ${m}분
            </div>
        </div>
    `;
    
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .catch(err => console.log('Service Worker Error'));
    });
}
</script>

</body>
</html>
