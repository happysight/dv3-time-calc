<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<title>등급 시간 계산기</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard',sans-serif;
}

body{
    background:#09090b;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    background:#18181b;
    border:1px solid #27272a;
    border-radius:28px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:800;
    color:white;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#a1a1aa;
    margin-bottom:24px;
}

.label{
    display:block;
    color:white;
    font-weight:600;
    margin-bottom:8px;
}

.time-row{
    display:flex;
    gap:12px;
}

.input-box{
    flex:1;
}

input,
select{
    width:100%;
    padding:14px;
    background:#27272a;
    border:2px solid #3f3f46;
    border-radius:14px;
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#71717a;
}

input:focus,
select:focus{
    outline:none;
    border-color:#3b82f6;
}

button{
    width:100%;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    margin-top:16px;
}

.calc-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
    font-size:15px;
    padding:12px;
}

.result{
    margin-top:20px;
    background:#27272a;
    border:1px solid #3f3f46;
    border-radius:18px;
    padding:20px;
}

.result-title{
    text-align:center;
    color:#a1a1aa;
    margin-bottom:10px;
}

.final-time{
    text-align:center;
    font-size:36px;
    font-weight:800;
    color:#60a5fa;
    margin-bottom:15px;
}

.info{
    display:flex;
    justify-content:space-between;
    color:white;
    margin-top:8px;
}

.badge{
    padding:6px 12px;
    border-radius:999px;
    font-weight:700;
}

.history-item{
    background:#3f3f46;
    border-radius:12px;
    padding:12px;
    margin-top:10px;
    color:white;
}

.history-date{
    color:#a1a1aa;
    font-size:12px;
    margin-top:4px;
}

.mode-badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="card">

    <div class="title">⏱️ 교배 시간 계산기</div>
    <div class="subtitle">등급별 시간 차감 계산</div>

    <label class="label">시간 입력</label>

    <div class="time-row">
        <div class="input-box">
            <input type="number" id="hours" placeholder="시간" min="0">
        </div>

        <div class="input-box">
            <input type="number" id="minutes" placeholder="분" min="0" max="59">
        </div>
    </div>

    <br>

    <label class="label">계산 모드</label>
<select id="mode">
<option value="normal">정방향 계산</option>
<option value="reverse" selected>역방향 계산</option>
</select>

<br>

<label class="label">등급 선택</label>

    <select id="grade">
        <option>노멀</option>
        <option>브론즈 / 실버</option>
        <option>골드 / 플래티넘</option>
        <option>다이아 / MVP</option>
    </select>

    <button class="calc-btn" onclick="calculate()">
        계산하기
    </button>

    <div class="result" id="result">

        <div class="result-title">원본 시간</div>

        <div class="final-time">
            0시간 0분
        </div>

        <div class="info">
            <span>등급</span>
            <span class="badge">노멀</span>
        </div>

        <div class="info">
            <span>차감률</span>
            <span>0%</span>
        </div>

        <div class="info">
            <span>차감 시간</span>
            <span>0시간 0분</span>
        </div>

    </div>

    <div class="result">

        <div class="result-title">
            📋 계산 기록 (최근 20개)
        </div>

        <div id="historyList">
            기록이 없습니다.
        </div>

        <button
            class="delete-btn"
            onclick="clearHistory()">
            기록 삭제
        </button>

    </div>

</div>

<script>

function getRate(grade){

    switch(grade){

        case "브론즈 / 실버":
            return 0.05;

        case "골드 / 플래티넘":
            return 0.08;

        case "다이아 / MVP":
            return 0.10;

        default:
            return 0;
    }
}

function getBadgeColor(grade){

    switch(grade){

        case "브론즈 / 실버":
            return "#b45309";

        case "골드 / 플래티넘":
            return "#ca8a04";

        case "다이아 / MVP":
            return "#2563eb";

        default:
            return "#52525b";
    }
}

function calculate(){

    const h =
        parseInt(document.getElementById("hours").value) || 0;

    const m =
        parseInt(document.getElementById("minutes").value) || 0;

    const grade =
        document.getElementById("grade").value;

    if(m > 59){
        alert("분은 0~59 사이만 입력 가능합니다.");
        return;
    }

    const totalMinutes =
        (h * 60) + m;

    const rate =
        getRate(grade);

    const mode =
        document.getElementById("mode").value;

    const finalMinutes =
        mode === "normal"
        ? Math.floor(totalMinutes * (1 - rate))
        : Math.round(totalMinutes / (1 - rate));

    const deductedMinutes =
        mode === "normal"
        ? totalMinutes - finalMinutes
        : finalMinutes - totalMinutes;

    const finalHour =
        Math.floor(finalMinutes / 60);

    const finalMin =
        finalMinutes % 60;

    const deductedHour =
        Math.floor(deductedMinutes / 60);

    const deductedMin =
        deductedMinutes % 60;

    const badgeColor =
        getBadgeColor(grade);

    const resultTitle =
        mode === "normal"
        ? "최종 시간"
        : "원본 시간";

    document.getElementById("result").innerHTML = `
        <div class="result-title">${resultTitle}</div>

        <div class="final-time">
            ${finalHour}시간 ${finalMin}분
        </div>

        <div class="info">
            <span>등급</span>
            <span class="badge"
            style="background:${badgeColor};color:white;">
                ${grade}
            </span>
        </div>

        <div class="info">
            <span>차감률</span>
            <span>${rate * 100}%</span>
        </div>

        <div class="info">
            <span>차감 시간</span>
            <span>${deductedHour}시간 ${deductedMin}분</span>
        </div>
    `;

    const record = {

        date:new Date().toLocaleString(),

        mode: mode === "normal" ? "정방향" : "역방향",

        input:`${h}시간 ${m}분`,

        grade:grade,

        result:`${finalHour}시간 ${finalMin}분`,

        rate:`${rate * 100}%`
    };

    let history =
        JSON.parse(
            localStorage.getItem("timeHistory")
        ) || [];

    history.unshift(record);

    history = history.slice(0,20);

    localStorage.setItem(
        "timeHistory",
        JSON.stringify(history)
    );

    renderHistory();
}

function renderHistory(){

    const history =
        JSON.parse(
            localStorage.getItem("timeHistory")
        ) || [];

    const container =
        document.getElementById("historyList");

    if(history.length === 0){

        container.innerHTML =
            "기록이 없습니다.";

        return;
    }

    container.innerHTML =
        history.map(item => `

        <div class="history-item">

            <div><b>${item.result}</b></div>

            <div>
                ${item.input} · ${item.grade}
            </div>

            <div class="mode-badge"
            style="background:${item.mode === '역방향' ? '#1e40af' : '#166534'};color:white;">
                ${item.mode || '정방향'}
            </div>

            <div>
                차감률: ${item.rate}
            </div>

            <div class="history-date">
                ${item.date}
            </div>

        </div>

        `).join('');
}

function clearHistory(){

    if(confirm("기록을 모두 삭제할까요?")){

        localStorage.removeItem("timeHistory");

        renderHistory();
    }
}

renderHistory();

</script>

</body>
</html>
